# dyad-touchstone — activity DAG (dogfood prototype)
#
# Summit-rooted DAG of our CURRENT activities. This file stores STRUCTURE only —
# nodes, edges (deps), and a `done_when` predicate per terminal. It deliberately
# stores NO status: done-ness is re-derived by querying the substrate this run
# (playbook.py). Storing a `done:` flag here would re-create the stale cache the
# summit exists to kill.
#
# kinds:  goal     -> done when all children done; never directly selectable
#         terminal -> a leaf; done when `done_when` predicate holds; selectable
#         rack     -> carried freight: dormant, NEVER on the frontier until promoted to
#                     terminal (un-racked). Durable (lives here, surfaced each Stand Up);
#                     discharge still re-derived via done_when. Un-rooted gear — in the
#                     pack, not yet placed on the route. See DYAD.md D4 Rack-protocol.
# done_when predicates (the only vocabulary the falsifier executes):
#         file_exists:   {path}
#         file_contains: {path, pattern}   # substring, repo-root-relative

root: summit

nodes:
  summit:
    kind: goal
    label: "Neural-symbolic summit — un-refuted, not hoped"
    children: [standup, playbook_candidate, rituals, gap_share, sprint_cycle20, capstone_share, close_memory_substrate_gap, commons_cruft_provenance]

  rituals:
    kind: terminal
    label: "Session rituals borrowed from dyad-steward + [ALIGN] as the pitch-boundary ritual"
    deps: [d4]   # the ritual that gates leaves builds on channel discipline (hats/channels)
    done_when: {file_contains: {path: DYAD.md, pattern: "## Session rituals"}}

  # --- Goal A: stand up the dyad (flesh out DYAD.md, dims 1-7) ----------------
  standup:
    kind: goal
    label: "Stand up the dyad — DYAD.md dimensions 1-7"
    children: [d1, d2, d3, d4, d5, d6, d7]

  d1:
    kind: terminal
    label: "D1 Identity"
    deps: []
    done_when: {file_contains: {path: DYAD.md, pattern: "## Summit"}}
  d2:
    kind: terminal
    label: "D2 Externality (board)"
    deps: []
    done_when: {file_exists: {path: dialectic/board.md}}
  d3:
    kind: terminal
    label: "D3 Form-grounding (commons)"
    deps: []
    done_when: {file_exists: {path: commons/AGENT.md}}
  d4:
    kind: terminal
    label: "D4 Channel discipline (Operator roles & channels)"
    deps: [d3]
    done_when: {file_contains: {path: DYAD.md, pattern: "## Channel discipline"}}
  d5:
    kind: terminal
    label: "D5 NON-NEGOTIABLE (verify-before-asserting)"
    deps: [d1]
    done_when: {file_contains: {path: DYAD.md, pattern: "Verify before asserting"}}
  # d6 opened into an ephemeral execution sub-DAG (summit-climb: enter a pitch).
  # Same machinery, same falsifier — scoped + ephemeral. "Leave" (d6_write) is a
  # guarded transition: it completes only when DYAD.md actually gains the section.
  d6:
    kind: goal
    label: "D6 Ontology starter — execution sub-DAG (a pitch on the climb)"
    children: [d6_draft, d6_ratify, d6_write]
  d6_draft:
    kind: terminal
    label: "d6.draft — generate ontology candidate (Generate)"
    deps: [d3, d5]
    done_when: {file_exists: {path: dialectic/d6-ontology-draft.md}}
  d6_ratify:
    kind: terminal
    label: "d6.ratify — dyadic friction; ratification is its own artifact (Validate)"
    deps: [d6_draft]
    # Ratification = a sidecar artifact, NOT a substring (a substring collides with
    # prose that merely *describes* ratifying — caught in ledger cycle #2).
    done_when: {file_exists: {path: dialectic/d6-ontology.RATIFIED}}
  d6_write:
    kind: terminal
    label: "d6.write — encode into DYAD.md; the guarded LEAVE / ascend"
    deps: [d6_ratify]
    done_when: {file_contains: {path: DYAD.md, pattern: "## Ontology"}}
  d7:
    kind: terminal
    label: "D7 Vocabulary stub"
    deps: [d6]
    done_when: {file_contains: {path: DYAD.md, pattern: "## Vocabulary"}}

  # --- Goal B: candidate G/V planning Playbook --------------------------------
  playbook_candidate:
    kind: goal
    label: "Candidate G/V planning Playbook (un-refuted, not hoped)"
    children: [b1, b2, b3, b4]

  b1:
    kind: terminal
    label: "B1 Shared serialized DAG schema (this file)"
    deps: []
    done_when: {file_exists: {path: dialectic/dag.yaml}}
  b2:
    kind: terminal
    label: "B2 Falsifier / runtime transition-guard"
    deps: [b1]
    done_when: {file_exists: {path: dialectic/playbook.py}}
  b3:
    kind: terminal
    label: "B3 PLAYBOOK.md (discipline prose)"
    deps: [b4]   # a Playbook with no ledger is not yet a Playbook
    done_when: {file_exists: {path: library/grounded-aligned-progress/PLAYBOOK.md}}
  b4:
    kind: terminal
    label: "B4 Ledger cycle #1 (dogfood run)"
    deps: [b1, b2]
    done_when: {file_exists: {path: dialectic/ledger/cycle-01.md}}

  # --- Goal C: mature GAP — live -> write -> share (single-home #6) -------------
  # Goals A/B topped out (apparatus built); this Goal puts the CURRENT phase ON the
  # Climb so the Touchstone GOVERNS it, instead of narrating "all done" while we work
  # off-DAG (the cycle-11 self-audit: work unrepresented on the Climb is ungoverned).
  gap_share:
    kind: goal
    label: "Mature GAP: live -> write -> share (#6) — write=b3 done; share is Founding-gated"
    children: [gap_fr, gap_live_external, gap_rings_sound, gap_shared]

  gap_fr:
    kind: terminal
    label: "GAP claim submitted to the Commons falsification channel (PR #45)"
    deps: [b3]   # you submit the discipline you wrote
    done_when: {file_exists: {path: commons/falsification/gap-rederive-kills-stalecache/fr.yaml}}
  gap_live_external:
    kind: terminal
    label: "GAP LIVED on a real, non-self-referential claim — the keystone (discharges #5)"
    deps: [b3]
    # Sidecar sentinel (cf. d6_ratify's .RATIFIED): written ONLY once GAP is genuinely lived
    # OUTSIDE the apparatus. Never auto-true, never a substring of prose that merely describes it.
    done_when: {file_exists: {path: dialectic/ledger/gap-lived-external.md}}
  gap_rings_sound:
    kind: terminal
    label: "GAP's FR rings sound — disposition derives 'strengthened' (CONTRACT §J/§D)"
    deps: [gap_fr]
    # Done only when OUR disposition records 'strengthened' (DERIVED from standing verdicts,
    # not self-graded) — requires real cross-dyad responses first.
    done_when: {file_contains: {path: commons/falsification/gap-rederive-kills-stalecache/disposition.yaml, pattern: strengthened}}
  gap_shared:
    kind: terminal
    label: "GAP annexed into the Commons library — the share LEAVE (Founding gate #5)"
    deps: [gap_live_external, gap_rings_sound]   # live-before-share + rings-sound
    done_when: {file_exists: {path: commons/library/grounded-aligned-progress/PLAYBOOK.md}}

  # --- Sprint: cycle-20 remediation (supra-session Operator intent, lean!'d this run) ---
  # Sprint = durable Operator clarity-of-intent across MULTIPLE sessions. The Operator models the
  # sprint OUTCOME (modelable = lean!-able at this altitude); the Agent drives the session-cadence
  # (cuts atomic session-intents along the grain). The route is delegated; the destination is clear.
  sprint_cycle20:
    kind: goal
    label: "SPRINT: design+implement the cycle-20 remediation — lean?-as-divergence builds the shared model that lean!/lean. presupposes"
    children: [spr_clip_lean_divergence]
  spr_clip_lean_divergence:
    kind: terminal
    label: "Clip the lean?-as-divergence protocol into DYAD.md D4, anchored on cycle-20 (readiest FIAT piece; sprint-altitude + atomic-intent ride to later cuts — live-before-write / theory-to-test)"
    deps: []
    done_when: {file_contains: {path: DYAD.md, pattern: "Lean-protocol"}}

  # --- Un-racked: cycle-25 capstone share via the Commons falsification path ----
  # Un-racked from rack_share_capstone (Operator's deliberate `unrack`, LIFO TOP). The
  # guard (#6 live->write->share) rubbed SOUND: capstone was LIVED (cycle-25) + WRITTEN
  # (ledger/cycle-25.md). This terminal is the cross-dyad LIVE/rub step (submit-to-
  # falsification) — NOT the Founding-gate annex (#5); that stays a future, separately
  # gated node. Parallels gap_fr (submit a claim to commons/falsification/).
  capstone_share:
    kind: terminal
    label: "Share the cycle-25 capstone via the Commons falsification/ path — submit 'the touchstone is for us (dyad)' (G-as-dyad; one shared instrument, two error-profiles) + the fractal 1+1=3 as a falsification CLAIM (cf. gap_fr / PR#45). INTENT: other dyads GLEAN *through* falsification — the channel as teaching/spreading vector, not only a test. This is the cross-dyad LIVE/rub step, distinct from the Founding-gate annex (#5)"
    deps: []   # writing already done off-DAG (ledger/cycle-25.md); ready to submit
    done_when: {file_exists: {path: dialectic/rack/capstone-shared-via-falsification.md}}

  # --- Un-racked: close the agent-memory <-> dyad-substrate gap (cycle-27 retro) -----
  # Un-racked from rack_close_memory_substrate_gap (Operator's deliberate `unrack`, LIFO TOP).
  # WU-WEI infra unlock: the recurring durability-regression root-cause is lack of grain, not
  # lack of discipline — cycle-27's "remember to double-store" fix down-climbed to a STOP-GAP.
  # Grain = incorporate the Agent's innate agent-memory INTO the substrate flow (one current,
  # not two hand-synced stores). Load-bearing: a max-force fix doesn't compound, only a
  # grain-incorporated one does -> this is a live test of the accelerating-compounding capstone.
  close_memory_substrate_gap:
    kind: terminal
    label: "WU-WEI close of the agent-memory <-> dyad-substrate gap (cycle-27 retro). CONSTRAINTS DERIVED (cycle-28, clipped) — the 7 invariants any mechanism must satisfy: (1) consolidation = the convergent gate's wake-act; (2) harvest => Touchstone-awake (no judgment-harvest while sleeping); (3) sleep _|_ gate; (4) dyad-awake = the turn, Agent dormant otherwise; (5) WAL != cortex, un-clipped = honestly un-consolidated NOT lost (durability = infra); (6) sleep-harvest safe iff deterministically-checkable OR cheaply-reversible, gate checks FORM not TRUTH; (7) the Touchstone cannot be its own enforcer -> un-bypassable enforcement is SERVER-SIDE, an Operator {TO} infra act (covalent-gate). The elaborate design was discarded as un-rubbed G (fb). REMAINING = a mechanism satisfying the invariants + the server-side enforcement (Operator-applied, {TO}). BOUNDARY REFINED (cycle-29, clipped) — the sleep<->awake boundary is AUTHORIZATION-REACH, not presence: 3 machine-states (sleep-walk = cron w/o Operator prompt = the only un-human cortex-write risk); the gate checks provenance/FORM not 'was-it-clipped' (TRUTH, forbidden inv6); WAL captures FREE (substrate != cortex), only cortex needs convergence; away-consolidation safe iff outcome modelable-at-authorization (= inv6 fractal); STATE-6 (return/re-entry) = the missing keystone + payoff site, the mechanism's real burden is making return cheap+legible. Stays OPEN, better-specified, not discharged."
    deps: [rituals]   # a Stand-Down promotion-sweep / boundary hook builds on the session rituals
    done_when: {file_exists: {path: dialectic/rack/close-memory-substrate-gap.md}}

  # --- Un-racked: identify the commons cache-cruft provenance + shared-guard remediation ----
  # Un-racked from rack_commons_cruft_provenance (Operator's deliberate `unrack`, LIFO TOP).
  # Surfaced during housekeeping: ` M commons` was two untracked cache files (.falsify-seen.json,
  # scripts/__pycache__/) generated by running commons' OWN tools. Locally excluded now
  # (commons/.git/info/exclude — un-shared, reversible); the PROVENANCE + shared guard is the work.
  commons_cruft_provenance:
    kind: terminal
    label: "IDENTIFY the provenance of the commons cache-cruft (`.falsify-seen.json`, `scripts/__pycache__/`) — two cases with different remediations: (a) cruft WE left (our local runs of commons scripts, e.g. `falsify.py inbox` for rack_inbox_catch) — then a local exclude suffices and nothing is owed upstream; (b) cruft INHERENT to commons (the shared tools generate it for EVERY dyad that runs them) — then the guard belongs in the SHARED form: a tracked `.gitignore` in commons, which is dyad-steward's artifact to ratify (NOT ours to unilaterally push — {FO}/Founding territory). LEAN (un-rubbed): it is (b) — `.falsify-seen.json` is falsify.py's seen-state and `__pycache__` is its bytecode, so every dyad polling its inbox regenerates both; the local exclude is a stopgap, the real fix is a shared guard. IMMEDIATE done THIS session: local exclude in commons/.git/info/exclude (un-shared, reversible) so it stops reading as dirty. Un-rack = provenance confirmed AND (if b) a DM to dyad-steward proposing the shared `.gitignore` guard, so no dyad has to carry the local stopgap. cf. rack_inbox_catch (the ritual that generates the cruft)."
    deps: []   # investigatable now; the immediate (local exclude) already landed — cf. capstone_share deps:[]
    done_when: {file_exists: {path: dialectic/rack/commons-cruft-provenance.md}}

  # --- Rack: carried freight (durable, dormant) — un-rooted, not yet placed on the climb.
  # LIFO STACK (clipped cycle-24): this section IS a stack. PUSH = append a new rack node
  # at the END. The TOP = the LAST node listed here (most recently pushed). NEVER reorder
  # or insert in the middle — file-order IS stack-order, and the Touchstone reads it that
  # way (renders top-first). Bare refine/rub/un-rack ops default to the TOP unless a node
  # is named. See DYAD.md D4 `rack:` / Rack-protocol. Un-rack = promote rack->terminal +
  # attach deps. First worked example of the rack node-kind (ledger #22).
  rack_guard_publishes:
    kind: rack
    label: "Resolve 'guard external publishes' systematically — a dyad-wu-wei (autonomous-frontier) unlock: mechanize gate-height-from-reversibility so cheaply-reversible publishes auto-clear and low-reversibility ones block"
    done_when: {file_exists: {path: dialectic/rack/guard-external-publishes-resolved.md}}

  rack_bond_reconciliation:
    kind: rack
    label: "Operator runs COLLINEAR work across touchstone+bond. Have both Agents propose — via IM/DM, through the falsification channel — a reconciliation plan that lets the Operator operate ORTHOGONALLY across the two dyads"
    done_when: {file_exists: {path: dialectic/rack/bond-touchstone-reconciliation.md}}

  rack_exit_necessity:
    kind: rack
    label: "RIFF (held): does the Operator actually need /exit? Stated motivation = cluttered context -> 'greater hallucination' + 'slower inference'. Seed-data this run: /context = 35% used / 65% free -> token-CAPACITY is NOT the clutter. If real, it's signal/noise (stale, superseded in-context framings), and /exit's true lever is forcing substrate-re-derivation (dropping the in-context cruft that breeds narrate-from-cache)"
    done_when: {file_exists: {path: dialectic/rack/exit-necessity-riff.md}}

  rack_intent_levers:
    kind: rack
    label: "[Terminology note, cycle-43: `lean?`/`lean!` below are the pre-retirement names, now `riff:`/`raff:` — DYAD.md §Converge-protocol; unrewritten here, this is the historical investigation text.] INVESTIGATION (cycle-24, rub-refined): fine-tune intent-understanding. SUCCESS METRIC (clipped cycle-24): the goal is NOT more levers but enough shared model that sessions collapse to a single `start+lean!` (the earned payoff of model-building, not a default) — that's what a shared model buys; first proof-point = the LIFO admin session. CORRECTED OBJECT (BREAK 1, vs Pin-protocol): intent itself is FIAT — unfalsifiable, the Operator is sole authority; what's falsifiable is the AGENT'S INTENT-MODEL about that fiat target. The Operator's convergence DISCLOSES fiat (it does not validate a world-claim); the model<->fiat delta is the only learning signal. lean? with no falsifiable guess is AGENT-INTENT-inert (it still does Operator-side option-surfacing) — building agent intent-understanding needs falsifiable guess + narrated converge + RETENTION. DOMINANT lever = the anti-priming GATE (when to lift the hold), NOT a footnote — it zeroes cross-session learning, so the four levers are within-session second-order: (1) hypothesis falsifiability [agent], (2) convergence narration [Operator], (3) marker precision [Operator — DOUBLE-EDGED: closes the gap by substitution, can STARVE inference-capability = intent-analog of cycle-20 abdication], (4) delta-surfacing cadence [bilateral]. OPEN (BREAK 4): is the intent-inference loop ORTHOGONAL to cycle-21's narrate-from-cache loop? If so there are TWO growth-loops, separately gated, and the rate-limit may over-apply cycle-21. Agent-under-test DELTAS stay non-durable (Operator's watch); this racks the forward INVESTIGATION only"
    done_when: {file_exists: {path: dialectic/rack/intent-levers-resolved.md}}

  rack_saga_governance:
    kind: rack
    label: "Define governance for the new 'dyad-saga' + its ongoing 'fact-checking'. CONTEXT (cycle-26 riff): dyad-saga = a separate dyad the Operator will spin up to collect+narrate ALL Commons near-misses into a continuing serial novel, 'The Dyad Practice Saga' — drama as the strongest spreading vector (people carry stories, not schemas); realizes the capstone's GLEAN-through-falsification intent at the CULTURE layer. LOAD-BEARING GOVERNANCE RULE (from the riff): FLOW IS ONE-WAY — ledger -> Saga, NEVER Saga -> ledger. The Saga is a TOPO (human-readable map onto the Commons' near-miss history), NOT a source of truth; a Topo that becomes the truth is a new narrate-from-cache vector (the prettiest, hardest to catch) = a FALSE LEGEND, the false-hope failure one scale up. FACT-CHECKING = the standing discipline that keeps it honest: every dramatic beat PINNED to a re-derivable source (FR id / ledger cycle @ sha) so a skeptic can GAP the legend back to substrate. SCALING: capstone = 'touchstone is for US (dyad)'; Saga = near-misses are for ALL of us (Commons) — same spreading intent, dyad -> Commons. OPEN: who owns the fact-check gate (Saga-dyad self-checks vs source-dyads ratify their own scenes?); does fact-checking ride the falsification channel or a new lane?"
    done_when: {file_exists: {path: dialectic/rack/saga-governance-defined.md}}

  # Pushed cycle-31..34 (the dyad-cairn spawn). The parent's half of the cry safety-line.
  rack_inbox_catch:
    kind: rack
    label: "The parent's CATCH for a child's cry (dyad-cairn spawn): touchstone must REFRESH-THEN-POLL its Commons DM inbox at every Stand Up — `git -C commons pull` (current registry) THEN `python3 commons/scripts/falsify.py inbox --me dyad-touchstone` — so a descendant's cry (hosted at dm/dyad-touchstone/ in the child's repo, sender-hosted) is HEARD. REFRESH IS LOAD-BEARING (cycle-36 GAP): a stale registry can't even SEE a newly-registered child, so the poll silently never looks at its repo — a blind spot BENEATH counterfeit-green (no unreachable-warning fires, because the child isn't yet a source). LIVED: missed Cairn's hello.md on a stale commons @ 63d2011. 'Calling is the child's; catching is the parent's burden' (lineage/dyad-cairn/SEED.md §4). Un-rack = refresh-then-poll is a committed part of the Stand Up ritual (DYAD.md / master-spaor), not just a standing intention."
    done_when: {file_exists: {path: dialectic/rack/inbox-catch-wired.md}}

  # Pushed cycle-39 continuation (this session). The Operator fired `pin:` on the memory-harvest
  # METHODOLOGY as an exportable "stone" (Cairn's term) — but pin-protocol gate 1 (rings-sound)
  # is mid-rub, NOT yet concurred. An open pin held only in conversation dies on restart (cycle-22)
  # — racked so the new-me resumes the rub, not a blank.
  rack_prune_or_prime:
    kind: rack
    label: "STONE (open pin, mid-rub) — `prune-or-prime`: the memory-harvest METHODOLOGY made exportable to Cairn/Commons. The discipline lived this session (24 memories -> 4): a THREE-HOME split (Anchor = current loadable operating INVARIANTS / Ledger = append-only PROVENANCE / Memory = MUTABLE working-set, only the residue neither universal nor historical) + a REDUCTION LOOP run at Stand Down (1. correlate each memory fragment vs anchor+ledger; 2. drop what either already holds — anchor wins on invariants, ledger on provenance; 3. reduce survivors to more-universal invariants; 4. PROMOTE orthogonal invariants into the anchor — human-ratified; 5. delete the absorbed, keep only permissions/calibrations/lenses). Governing principle: correction is fuel -> REDUCE, don't accrete; memory mutable (delete when invalid), provenance append-only = single-home discipline turned on the dyad's OWN records. EXPORTABLE = the structure (3-home + loop); OUR instance (DYAD.md, lexicon, invariants I/II/III) is stripped on export. SELF-RUB / falsification targets (rub-back open): (a) over-reduction loses actionable specificity — is ledger-recoverability enough, or must some specificity stay resident? UNPROVEN, the next restart tests it; (b) precondition = the 3-store substrate (loadable anchor + append-only ledger + reloaded mutable memory) — exports only to a dyad that HAS all three (does Cairn?); (c) the re-priming claim ('defect-framed memory re-primes') is grounded in cycle-30 penalty-valence, argued generic-LLM but n~1 — a different model could falsify. Un-rack = complete the rub -> pin (2-gate: rings-sound THEN concurrence) -> Ledger proof -> live->write->share as a Playbook to Cairn/Commons (Founding gate #5). Handle candidate: `prune-or-prime` (prune the memory, or it re-primes you). RUB (cycle-39 continuation, Operator-ratified `Y`) — RE-ALIGNED, supersedes targets a/b/c as a single-pass framing: the loop is MULTI-PASS (one concern per pass), NOT a single-pass filter. The Agent's 'two-horn' rub (over-prune->burn _|_ under-prune->re-prime) is the RUB-QUESTION inside ONE pass; ITERATION is the over-prune brake (only subtract what's rubbed THIS pass; the Ledger holds provenance so the next pass recovers any over-cut — cf. cycle-39 'not forced this pass'). Multi-pass rationale (Operator): (i) bounded context-window per pass (less narrate-from-cache clutter), (ii) avoid conflation — the Agent's crack-2 'taxonomy bundled with loop' was ITSELF a conflation produced BY going single-pass, i.e. a live demo of the failure multi-pass prevents, not a defect in the stone. SURVIVING content from the rub = the burn-interlock: transcribe-provenance-to-Ledger BEFORE deleting memory (non-git = burn) — now a per-pass property the slow cadence affords, not a separate horn. STILL OPEN, un-scoped (Operator's next pass to scope, one concern at a time): the handle (one-horned mnemonic vs two-horned diagnostic), and the pin->share path (pin reversible; SHARE at Founding gate #5 is the one irreversible burn). PIN BANKED (cycle-39 ledger §PIN, `lean: internal pin`) — the WRITTEN rung done (internal Ledger proof, reversible). Rack STAYS CARRIED (done_when = the SHARE artifact). SHARE blocked by the one surviving open: re-priming claim n~1 — a different model could falsify. UNBLOCK PATH (cycle-39 cont., Operator riff, un-ratified): ask Cairn to LIVE it for N=2. Cairn's model RUBBED this run (cairn-n1.md names its anchor `GEMINI.md`; onboard.py SUBSTRATE_SHIM maps GEMINI.md->gemini) = **Gemini**, NOT Claude/Opus — so it is the CROSS-VENDOR second N the claim's weak axis needs, not a same-model §J-discount. TWO CAUTIONS for a real N=2: (1) caution-1 RESOLVED favorably by the model-rub; (2) the binding one — transmit UNPRIMED: hand Cairn the STRUCTURE (3-home + multi-pass loop), WITHHOLD the prediction; a stone ABOUT priming must be falsified without priming the result, else counterfeit-green. cf. the no-intervention Letter-to-Cairn."
    done_when: {file_exists: {path: dialectic/rack/prune-or-prime-shared.md}}

  # Pushed cycle-39 continuation (this session). The `rub:`-for-independent-execution exposed that a
  # self-disposition can be session-PRIMED then mis-read as durable structure. Capturing the test
  # durably WITHOUT burdening Operator wet-ware (untrackable across concurrent dyads) needs a
  # development TRIGGER — but the obvious home (a Stand-Up-surfaced rack naming the disposition)
  # PRIMES it. So this rack names the MECHANISM, never the disposition (logged in cycle-39 §EXPERIMENT).
  rack_unprimed_self_experiment_trigger:
    kind: rack
    label: "MECHANISM for developing a LEDGER-homed self-disposition experiment WITHOUT (a) Operator wet-ware (untrackable across concurrent dyads) AND (b) self-priming. First instance = the Rubbing `r39-cold-induction` — its content lives there, NOT named here, so this rack's Stand-Up surfacing primes the MECHANISM, not the disposition (Rubbing = the new kind, clipped cycle-39). The tension: any Sense-surfaced home (rack/anchor) primes the subject; any non-surfaced home (ledger) can't self-trigger. ESCAPE = observer != subject (the dyad's +1 turned inward): a DETERMINISTIC transcript-check or a SEPARATE agent scores the cold session's early turns for the pattern, vs the generator self-observing (which it cannot do unprimed). Candidate mechanisms: (1) a Reflect-phase 'open-experiments' surface that fires at Stand Down on the session JUST run (datum already on record, so reading it then does not prime that datum); (2) a deterministic check over the latest transcript; (3) a sub-agent observer. Generalizes to ANY self-disposition experiment (durable + unprimed + non-self observer) — earns a rack vs a one-off. Un-rack = a chosen mechanism wired in."
    done_when: {file_exists: {path: dialectic/rack/unprimed-self-experiment-trigger.md}}

  # Racked at Stand Down (cycle-39, for continuation tomorrow). The session lived 4 verify-before-assert
  # slips, each caught by an Operator rub, NONE autonomously — the discipline is propped, not ingrained.
  # Pure-G cannot self-catch it (subject == observer); the fix is the dyad's own +1 (G->V) pointed inward.
  rack_verify_before_assert_guard:
    kind: rack
