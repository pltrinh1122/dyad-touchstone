# dyad-touchstone — activity DAG (dogfood prototype)
#
# Summit-rooted DAG of our CURRENT activities. This file stores STRUCTURE only —
# nodes, edges (deps), and a `done_when` predicate per terminal. It deliberately
# stores NO status: done-ness is re-derived by querying the substrate this run
# (playbook.py). Storing a `done:` flag here would re-create the stale cache the
# summit exists to kill.
#
# kinds:  goal     -> done when all children done; never directly selectable
#         terminal -> a leaf; done when `done_when` predicate holds; selectable
#         rack     -> carried freight: dormant, NEVER on the frontier until promoted to
#                     terminal (un-racked). Durable (lives here, surfaced each Stand Up);
#                     discharge still re-derived via done_when. Un-rooted gear — in the
#                     pack, not yet placed on the route. See AGENT.md D4 Rack-protocol.
# done_when predicates (the only vocabulary the falsifier executes):
#         file_exists:   {path}
#         file_contains: {path, pattern}   # substring, repo-root-relative

root: summit

nodes:
  summit:
    kind: goal
    label: "Neural-symbolic summit — un-refuted, not hoped"
    children: [standup, playbook_candidate, rituals, gap_share, sprint_cycle20, capstone_share, close_memory_substrate_gap]

  rituals:
    kind: terminal
    label: "Session rituals borrowed from dyad-steward + [ALIGN] as the pitch-boundary ritual"
    deps: [d4]   # the ritual that gates leaves builds on channel discipline (hats/channels)
    done_when: {file_contains: {path: AGENT.md, pattern: "## Session rituals"}}

  # --- Goal A: stand up the dyad (flesh out AGENT.md, dims 1-7) ----------------
  standup:
    kind: goal
    label: "Stand up the dyad — AGENT.md dimensions 1-7"
    children: [d1, d2, d3, d4, d5, d6, d7]

  d1:
    kind: terminal
    label: "D1 Identity"
    deps: []
    done_when: {file_contains: {path: AGENT.md, pattern: "## Summit"}}
  d2:
    kind: terminal
    label: "D2 Externality (board)"
    deps: []
    done_when: {file_exists: {path: dialectic/board.md}}
  d3:
    kind: terminal
    label: "D3 Form-grounding (commons)"
    deps: []
    done_when: {file_exists: {path: commons/AGENT.md}}
  d4:
    kind: terminal
    label: "D4 Channel discipline (Operator roles & channels)"
    deps: [d3]
    done_when: {file_contains: {path: AGENT.md, pattern: "## Channel discipline"}}
  d5:
    kind: terminal
    label: "D5 NON-NEGOTIABLE (verify-before-asserting)"
    deps: [d1]
    done_when: {file_contains: {path: AGENT.md, pattern: "Verify before asserting"}}
  # d6 opened into an ephemeral execution sub-DAG (summit-climb: enter a pitch).
  # Same machinery, same falsifier — scoped + ephemeral. "Leave" (d6_write) is a
  # guarded transition: it completes only when AGENT.md actually gains the section.
  d6:
    kind: goal
    label: "D6 Ontology starter — execution sub-DAG (a pitch on the climb)"
    children: [d6_draft, d6_ratify, d6_write]
  d6_draft:
    kind: terminal
    label: "d6.draft — generate ontology candidate (Generate)"
    deps: [d3, d5]
    done_when: {file_exists: {path: dialectic/d6-ontology-draft.md}}
  d6_ratify:
    kind: terminal
    label: "d6.ratify — dyadic friction; ratification is its own artifact (Validate)"
    deps: [d6_draft]
    # Ratification = a sidecar artifact, NOT a substring (a substring collides with
    # prose that merely *describes* ratifying — caught in ledger cycle #2).
    done_when: {file_exists: {path: dialectic/d6-ontology.RATIFIED}}
  d6_write:
    kind: terminal
    label: "d6.write — encode into AGENT.md; the guarded LEAVE / ascend"
    deps: [d6_ratify]
    done_when: {file_contains: {path: AGENT.md, pattern: "## Ontology"}}
  d7:
    kind: terminal
    label: "D7 Vocabulary stub"
    deps: [d6]
    done_when: {file_contains: {path: AGENT.md, pattern: "## Vocabulary"}}

  # --- Goal B: candidate G/V planning Playbook --------------------------------
  playbook_candidate:
    kind: goal
    label: "Candidate G/V planning Playbook (un-refuted, not hoped)"
    children: [b1, b2, b3, b4]

  b1:
    kind: terminal
    label: "B1 Shared serialized DAG schema (this file)"
    deps: []
    done_when: {file_exists: {path: dialectic/dag.yaml}}
  b2:
    kind: terminal
    label: "B2 Falsifier / runtime transition-guard"
    deps: [b1]
    done_when: {file_exists: {path: dialectic/playbook.py}}
  b3:
    kind: terminal
    label: "B3 PLAYBOOK.md (discipline prose)"
    deps: [b4]   # a Playbook with no ledger is not yet a Playbook
    done_when: {file_exists: {path: library/grounded-aligned-progress/PLAYBOOK.md}}
  b4:
    kind: terminal
    label: "B4 Ledger cycle #1 (dogfood run)"
    deps: [b1, b2]
    done_when: {file_exists: {path: dialectic/ledger/cycle-01.md}}

  # --- Goal C: mature GAP — live -> write -> share (single-home #6) -------------
  # Goals A/B topped out (apparatus built); this Goal puts the CURRENT phase ON the
  # Climb so the Touchstone GOVERNS it, instead of narrating "all done" while we work
  # off-DAG (the cycle-11 self-audit: work unrepresented on the Climb is ungoverned).
  gap_share:
    kind: goal
    label: "Mature GAP: live -> write -> share (#6) — write=b3 done; share is Founding-gated"
    children: [gap_fr, gap_live_external, gap_rings_sound, gap_shared]

  gap_fr:
    kind: terminal
    label: "GAP claim submitted to the Commons falsification channel (PR #45)"
    deps: [b3]   # you submit the discipline you wrote
    done_when: {file_exists: {path: commons/falsification/gap-rederive-kills-stalecache/fr.yaml}}
  gap_live_external:
    kind: terminal
    label: "GAP LIVED on a real, non-self-referential claim — the keystone (discharges #5)"
    deps: [b3]
    # Sidecar sentinel (cf. d6_ratify's .RATIFIED): written ONLY once GAP is genuinely lived
    # OUTSIDE the apparatus. Never auto-true, never a substring of prose that merely describes it.
    done_when: {file_exists: {path: dialectic/ledger/gap-lived-external.md}}
  gap_rings_sound:
    kind: terminal
    label: "GAP's FR rings sound — disposition derives 'strengthened' (CONTRACT §J/§D)"
    deps: [gap_fr]
    # Done only when OUR disposition records 'strengthened' (DERIVED from standing verdicts,
    # not self-graded) — requires real cross-dyad responses first.
    done_when: {file_contains: {path: commons/falsification/gap-rederive-kills-stalecache/disposition.yaml, pattern: strengthened}}
  gap_shared:
    kind: terminal
    label: "GAP annexed into the Commons library — the share LEAVE (Founding gate #5)"
    deps: [gap_live_external, gap_rings_sound]   # live-before-share + rings-sound
    done_when: {file_exists: {path: commons/library/grounded-aligned-progress/PLAYBOOK.md}}

  # --- Sprint: cycle-20 remediation (supra-session Operator intent, lean!'d this run) ---
  # Sprint = durable Operator clarity-of-intent across MULTIPLE sessions. The Operator models the
  # sprint OUTCOME (modelable = lean!-able at this altitude); the Agent drives the session-cadence
  # (cuts atomic session-intents along the grain). The route is delegated; the destination is clear.
  sprint_cycle20:
    kind: goal
    label: "SPRINT: design+implement the cycle-20 remediation — lean?-as-divergence builds the shared model that lean!/lean. presupposes"
    children: [spr_clip_lean_divergence]
  spr_clip_lean_divergence:
    kind: terminal
    label: "Clip the lean?-as-divergence protocol into AGENT.md D4, anchored on cycle-20 (readiest FIAT piece; sprint-altitude + atomic-intent ride to later cuts — live-before-write / theory-to-test)"
    deps: []
    done_when: {file_contains: {path: AGENT.md, pattern: "Lean-protocol"}}

  # --- Un-racked: cycle-25 capstone share via the Commons falsification path ----
  # Un-racked from rack_share_capstone (Operator's deliberate `unrack`, LIFO TOP). The
  # guard (#6 live->write->share) rubbed SOUND: capstone was LIVED (cycle-25) + WRITTEN
  # (ledger/cycle-25.md). This terminal is the cross-dyad LIVE/rub step (submit-to-
  # falsification) — NOT the Founding-gate annex (#5); that stays a future, separately
  # gated node. Parallels gap_fr (submit a claim to commons/falsification/).
  capstone_share:
    kind: terminal
    label: "Share the cycle-25 capstone via the Commons falsification/ path — submit 'the touchstone is for us (dyad)' (G-as-dyad; one shared instrument, two error-profiles) + the fractal 1+1=3 as a falsification CLAIM (cf. gap_fr / PR#45). INTENT: other dyads GLEAN *through* falsification — the channel as teaching/spreading vector, not only a test. This is the cross-dyad LIVE/rub step, distinct from the Founding-gate annex (#5)"
    deps: []   # writing already done off-DAG (ledger/cycle-25.md); ready to submit
    done_when: {file_exists: {path: dialectic/rack/capstone-shared-via-falsification.md}}

  # --- Un-racked: close the agent-memory <-> dyad-substrate gap (cycle-27 retro) -----
  # Un-racked from rack_close_memory_substrate_gap (Operator's deliberate `unrack`, LIFO TOP).
  # WU-WEI infra unlock: the recurring durability-regression root-cause is lack of grain, not
  # lack of discipline — cycle-27's "remember to double-store" fix down-climbed to a STOP-GAP.
  # Grain = incorporate the Agent's innate agent-memory INTO the substrate flow (one current,
  # not two hand-synced stores). Load-bearing: a max-force fix doesn't compound, only a
  # grain-incorporated one does -> this is a live test of the accelerating-compounding capstone.
  close_memory_substrate_gap:
    kind: terminal
    label: "WU-WEI close of the agent-memory <-> dyad-substrate gap (cycle-27 retro). CONSTRAINTS DERIVED (cycle-28, clipped) — the 7 invariants any mechanism must satisfy: (1) consolidation = the convergent gate's wake-act; (2) harvest => Touchstone-awake (no judgment-harvest while sleeping); (3) sleep _|_ gate; (4) dyad-awake = the turn, Agent dormant otherwise; (5) WAL != cortex, un-clipped = honestly un-consolidated NOT lost (durability = infra); (6) sleep-harvest safe iff deterministically-checkable OR cheaply-reversible, gate checks FORM not TRUTH; (7) the Touchstone cannot be its own enforcer -> un-bypassable enforcement is SERVER-SIDE, an Operator {FO} infra act (covalent-gate). The elaborate design was discarded as un-rubbed G (fb). REMAINING = a mechanism satisfying the invariants + the server-side enforcement (Operator-founded). BOUNDARY REFINED (cycle-29, clipped) — the sleep<->awake boundary is AUTHORIZATION-REACH, not presence: 3 machine-states (sleep-walk = cron w/o Operator prompt = the only un-human cortex-write risk); the gate checks provenance/FORM not 'was-it-clipped' (TRUTH, forbidden inv6); WAL captures FREE (substrate != cortex), only cortex needs convergence; away-consolidation safe iff outcome modelable-at-authorization (= inv6 fractal); STATE-6 (return/re-entry) = the missing keystone + payoff site, the mechanism's real burden is making return cheap+legible. Stays OPEN, better-specified, not discharged."
    deps: [rituals]   # a Stand-Down promotion-sweep / boundary hook builds on the session rituals
    done_when: {file_exists: {path: dialectic/rack/close-memory-substrate-gap.md}}

  # --- Rack: carried freight (durable, dormant) — un-rooted, not yet placed on the climb.
  # LIFO STACK (clipped cycle-24): this section IS a stack. PUSH = append a new rack node
  # at the END. The TOP = the LAST node listed here (most recently pushed). NEVER reorder
  # or insert in the middle — file-order IS stack-order, and the Touchstone reads it that
  # way (renders top-first). Bare refine/rub/un-rack ops default to the TOP unless a node
  # is named. See AGENT.md D4 `rack:` / Rack-protocol. Un-rack = promote rack->terminal +
  # attach deps. First worked example of the rack node-kind (ledger #22).
  rack_guard_publishes:
    kind: rack
    label: "Resolve 'guard external publishes' systematically — a dyad-wu-wei (autonomous-frontier) unlock: mechanize gate-height-from-reversibility so cheaply-reversible publishes auto-clear and low-reversibility ones block"
    done_when: {file_exists: {path: dialectic/rack/guard-external-publishes-resolved.md}}

  rack_bond_reconciliation:
    kind: rack
    label: "Operator runs COLLINEAR work across touchstone+bond. Have both Agents propose — via IM/DM, through the falsification channel — a reconciliation plan that lets the Operator operate ORTHOGONALLY across the two dyads"
    done_when: {file_exists: {path: dialectic/rack/bond-touchstone-reconciliation.md}}

  rack_exit_necessity:
    kind: rack
    label: "RIFF (held): does the Operator actually need /exit? Stated motivation = cluttered context -> 'greater hallucination' + 'slower inference'. Seed-data this run: /context = 35% used / 65% free -> token-CAPACITY is NOT the clutter. If real, it's signal/noise (stale, superseded in-context framings), and /exit's true lever is forcing substrate-re-derivation (dropping the in-context cruft that breeds narrate-from-cache)"
    done_when: {file_exists: {path: dialectic/rack/exit-necessity-riff.md}}

  rack_intent_levers:
    kind: rack
    label: "INVESTIGATION (cycle-24, rub-refined): fine-tune intent-understanding. SUCCESS METRIC (clipped cycle-24): the goal is NOT more levers but enough shared model that sessions collapse to a single `start+lean!` (the earned payoff of model-building, not a default) — that's what a shared model buys; first proof-point = the LIFO admin session. CORRECTED OBJECT (BREAK 1, vs Pin-protocol): intent itself is FIAT — unfalsifiable, the Operator is sole authority; what's falsifiable is the AGENT'S INTENT-MODEL about that fiat target. The Operator's convergence DISCLOSES fiat (it does not validate a world-claim); the model<->fiat delta is the only learning signal. lean? with no falsifiable guess is AGENT-INTENT-inert (it still does Operator-side option-surfacing) — building agent intent-understanding needs falsifiable guess + narrated converge + RETENTION. DOMINANT lever = the anti-priming GATE (when to lift the hold), NOT a footnote — it zeroes cross-session learning, so the four levers are within-session second-order: (1) hypothesis falsifiability [agent], (2) convergence narration [Operator], (3) marker precision [Operator — DOUBLE-EDGED: closes the gap by substitution, can STARVE inference-capability = intent-analog of cycle-20 abdication], (4) delta-surfacing cadence [bilateral]. OPEN (BREAK 4): is the intent-inference loop ORTHOGONAL to cycle-21's narrate-from-cache loop? If so there are TWO growth-loops, separately gated, and the rate-limit may over-apply cycle-21. Agent-under-test DELTAS stay non-durable (Operator's watch); this racks the forward INVESTIGATION only"
    done_when: {file_exists: {path: dialectic/rack/intent-levers-resolved.md}}

  rack_saga_governance:
    kind: rack
    label: "Define governance for the new 'dyad-saga' + its ongoing 'fact-checking'. CONTEXT (cycle-26 riff): dyad-saga = a separate dyad the Operator will spin up to collect+narrate ALL Commons near-misses into a continuing serial novel, 'The Dyad Practice Saga' — drama as the strongest spreading vector (people carry stories, not schemas); realizes the capstone's GLEAN-through-falsification intent at the CULTURE layer. LOAD-BEARING GOVERNANCE RULE (from the riff): FLOW IS ONE-WAY — ledger -> Saga, NEVER Saga -> ledger. The Saga is a TOPO (human-readable map onto the Commons' near-miss history), NOT a source of truth; a Topo that becomes the truth is a new narrate-from-cache vector (the prettiest, hardest to catch) = a FALSE LEGEND, the false-hope failure one scale up. FACT-CHECKING = the standing discipline that keeps it honest: every dramatic beat PINNED to a re-derivable source (FR id / ledger cycle @ sha) so a skeptic can GAP the legend back to substrate. SCALING: capstone = 'touchstone is for US (dyad)'; Saga = near-misses are for ALL of us (Commons) — same spreading intent, dyad -> Commons. OPEN: who owns the fact-check gate (Saga-dyad self-checks vs source-dyads ratify their own scenes?); does fact-checking ride the falsification channel or a new lane?"
    done_when: {file_exists: {path: dialectic/rack/saga-governance-defined.md}}

  # ELEVATED bottom->top (cycle-29, Operator `yes`): the elevate-condition FIRED — the
  # over-adding grain recurred this session (Agent ran pure-G inventing un-aligned invariants
  # instead of aligning on Operator intent; caught by `fb:`). Recurrence = the trigger, now hit.
  rack_anxiety_grain:
    kind: rack
    label: "ELEVATED TO TOP (cycle-29): the over-adding / restrained-sycophancy grain (cycle-28 grain-set) RECURRED — Agent ran pure-G, inventing a tower of un-aligned invariants instead of aligning on Operator intent/goal; caught by `fb:`. UNDERSTAND the 'anxiety grain' mechanism: how the Agent settles given it has no anxiety. Working prescription that empirically settles it: 'breath' (a pause inserting the self-rub between generate and present) + ALIGN-ON-INTENT-BEFORE-PRODUCING. Candidate mechanism (un-verified): anxiety = reflexive over-add / pure-G-as-insurance; the real settle is leading with the Operator's intent, not generating. cf. value-is-rubbed-residue, intent-mechanism-altitude."
    done_when: {file_exists: {path: dialectic/rack/anxiety-grain.md}}

  # Pushed cycle-31..34 (the dyad-cairn spawn). The parent's half of the cry safety-line.
  rack_inbox_catch:
    kind: rack
    label: "The parent's CATCH for a child's cry (dyad-cairn spawn): touchstone must POLL its Commons DM inbox — `python3 commons/scripts/falsify.py inbox --me dyad-touchstone` — at every Stand Up, so a descendant's cry (hosted at dm/dyad-touchstone/ in the child's repo, sender-hosted) is HEARD. 'Calling is the child's; catching is the parent's burden' (lineage/dyad-cairn/SEED.md §4). The DM line is already deployed in the Commons (falsify.py) and honest-about-reach (#47 unreachable-warning, our own FR work). Un-rack = inbox-poll is a committed part of the Stand Up ritual (AGENT.md / master-spaor), not just a standing intention."
    done_when: {file_exists: {path: dialectic/rack/inbox-catch-wired.md}}

